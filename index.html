<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PCgram - Mobile</title>
    <style>
        :root { --tg-blue: #0088cc; --tg-bg: #e7ebf0; --sent: #effdde; }
        
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--tg-bg); height: 100vh; overflow: hidden; }

        /* Écrans */
        #view-list, #view-chat { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; transition: transform 0.3s ease; }
        
        /* Navigation entre écrans */
        .hidden { display: none !important; }

        /* Header */
        .header { background: var(--tg-blue); color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; min-height: 60px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-left { display: flex; align-items: center; gap: 10px; }

        /* Liste Contacts */
        .contact-list { flex: 1; overflow-y: auto; background: white; }
        .contact-item { padding: 18px 15px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .contact-item:active { background: #f0f0f0; }

        /* Chat */
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #e7ebf0; }
        .msg { max-width: 85%; padding: 10px 14px; border-radius: 15px; font-size: 15px; line-height: 1.4; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 4px; }
        .received { align-self: flex-start; background: white; border-bottom-left-radius: 4px; }

        /* Input Zone */
        .input-area { padding: 10px; background: white; display: flex; gap: 8px; align-items: center; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 16px; }
        
        /* Boutons */
        .btn-icon { background: none; border: none; color: white; font-size: 20px; cursor: pointer; padding: 5px; }
        .send-btn { color: var(--tg-blue); font-weight: bold; border: none; background: none; font-size: 16px; padding-right: 10px; }
        .add-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 15px; font-size: 13px; }
    </style>
</head>
<body>

    <div id="view-list">
        <div class="header">
            <span>PCgram</span>
            <button class="add-btn" onclick="addNewContact()">+ NOUVEAU</button>
        </div>
        <div id="my-id-display" style="padding: 10px; font-size: 12px; background: #fdfdfd; border-bottom: 1px solid #eee; color: #888; text-align: center;"></div>
        <div id="contact-list" class="contact-list"></div>
    </div>

    <div id="view-chat" class="hidden">
        <div class="header">
            <div class="header-left">
                <button class="btn-icon" onclick="backToList()">←</button>
                <span id="chat-header-title">Chat</span>
            </div>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">ENVOYER</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCUOaafijAqzEofCgiJHwhscYCg997dlQI",
        authDomain: "pcgram-65fca.firebaseapp.com",
        projectId: "pcgram-65fca",
        storageBucket: "pcgram-65fca.firebasestorage.app",
        messagingSenderId: "625488249988",
        appId: "1:625488249988:web:8a9ab961b92d8a80e7aed1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let monId = localStorage.getItem('pcgram_user');
    let targetId = null;
    let unsubMessages = null;

    // --- MANIFEST ---
    const manifest = {
        "name": "PCgram", "short_name": "PCgram", "start_url": ".", "display": "standalone",
        "background_color": "#e7ebf0", "theme_color": "#0088cc",
        "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/3536/3536445.png", "sizes": "192x192", "type": "image/png"}]
    };
    document.querySelector('head').insertAdjacentHTML('beforeend', `<link rel="manifest" href="data:application/json;base64,${btoa(JSON.stringify(manifest))}">`);

    // --- LOGIQUE NAVIGATION ---
    window.backToList = () => {
        document.getElementById('view-chat').classList.add('hidden');
        document.getElementById('view-list').classList.remove('hidden');
        targetId = null;
        if (unsubMessages) unsubMessages();
    };

    // --- INITIALISATION ---
    async function initSession() {
        if (!monId) {
            monId = prompt("Crée ton identifiant unique :");
            if (monId) {
                monId = monId.trim().toLowerCase();
                await setDoc(doc(db, "users", monId), { created: Date.now() });
                localStorage.setItem('pcgram_user', monId);
            } else return initSession();
        }
        document.getElementById('my-id-display').innerText = "Mon ID : " + monId;
        renderContacts();
    }

    window.addNewContact = async () => {
        const id = prompt("ID de la personne :");
        if (!id) return;
        const cleanId = id.trim().toLowerCase();
        if (cleanId === monId) return alert("C'est vous !");

        const userDoc = await getDoc(doc(db, "users", cleanId));
        if (userDoc.exists()) {
            let contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
            if (!contacts.includes(cleanId)) {
                contacts.push(cleanId);
                localStorage.setItem('contacts', JSON.stringify(contacts));
                renderContacts();
            }
        } else alert("Utilisateur inconnu.");
    };

    function renderContacts() {
        const list = document.getElementById('contact-list');
        const contacts = JSON.parse(localStorage.getItem('contacts') || '[]');
        list.innerHTML = contacts.length === 0 ? "<div style='padding:20px;text-align:center;color:#888;'>Aucun contact</div>" : "";
        contacts.forEach(id => {
            const div = document.createElement('div');
            div.className = 'contact-item';
            div.innerHTML = `<span><b>${id}</b></span><span>></span>`;
            div.onclick = () => startChat(id);
            list.appendChild(div);
        });
    }

    window.startChat = (id) => {
        targetId = id;
        document.getElementById('view-list').classList.add('hidden');
        document.getElementById('view-chat').classList.remove('hidden');
        document.getElementById('chat-header-title').innerText = id;
        listenMessages();
    };

    function listenMessages() {
        const q = query(collection(db, "messages"), orderBy("timestamp", "asc"));
        unsubMessages = onSnapshot(q, (snapshot) => {
            const box = document.getElementById('messages');
            box.innerHTML = "";
            snapshot.forEach(doc => {
                const d = doc.data();
                if ((d.sender === monId && d.receiver === targetId) || (d.sender === targetId && d.receiver === monId)) {
                    const div = document.createElement('div');
                    div.className = `msg ${d.sender === monId ? 'sent' : 'received'}`;
                    div.textContent = d.content;
                    box.appendChild(div);
                }
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    window.sendMessage = async () => {
        const inp = document.getElementById('msgInput');
        if (!inp.value.trim() || !targetId) return;
        const val = inp.value;
        inp.value = ""; // Clear immédiat pour fluidité
        await addDoc(collection(db, "messages"), {
            sender: monId, receiver: targetId, content: val, timestamp: Date.now()
        });
    };

    initSession();
</script>
</body>
</html>
